name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck bin/claude-keepalive install.sh uninstall.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run tests
        run: bats tests/

  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every placeholder must be substituted by install.sh
        run: |
          for f in share/systemd/*.in share/launchd/*.in; do
            grep -oE '@[A-Z_]+@' "$f" | sort -u | while read -r ph; do
              grep -q -- "$ph" install.sh || {
                echo "placeholder $ph in $f is never substituted"; exit 1; }
            done
          done
