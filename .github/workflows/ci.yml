name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck bin/claude-keepalive install.sh uninstall.sh lib/backend.sh

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n every script
        run: |
          for f in bin/claude-keepalive install.sh uninstall.sh lib/backend.sh; do
            bash -n "$f"
          done

  units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generated systemd units must be valid
        run: |
          # shellcheck disable=SC1091
          . lib/backend.sh
          mkdir -p /tmp/u
          bk_systemd_service /usr/bin/claude-keepalive > /tmp/u/claude-keepalive.service
          bk_systemd_timer  "6,11,16,21"              > /tmp/u/claude-keepalive.timer
          systemd-analyze verify /tmp/u/claude-keepalive.timer
          systemd-analyze calendar "*-*-* $(hours_pad 6,11,16,21):00:00"
        shell: bash

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y bats
      - run: bats tests/
